<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ELITE VAULT — Prediction Panel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================================
           GLOBAL & FRAME COMPATIBILITY
        ============================================================ */
        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background: #000; -webkit-font-smoothing: antialiased; overflow: hidden; }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        #gameFrame, #target-game-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; z-index: 1; }
        #elite-vault-root { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: hidden; z-index: 9999; }
        
        /* ─── TAP BURST & DROP CANVAS ─── */
        #dropCanvas, #burstCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #dropCanvas { z-index: 9; }
        #burstCanvas { z-index: 9999; }

        /* ============================================================
           ZAYRO / ELITE MERGED OVERLAYS (WARN & LIVE FEED)
        ============================================================ */
        @keyframes blink { to { opacity: .25 } }
        @keyframes auroraShift { 0% { background-position: 0% 50% } 100% { background-position: 100% 50% } }
        @keyframes scanDown { 0% { top: -4%; opacity: 0 } 8% { opacity: 1 } 92% { opacity: 1 } 100% { top: 104%; opacity: 0 } }
        @keyframes iconPing { 0% { transform: scale(.7); opacity: .9 } 100% { transform: scale(2); opacity: 0 } }
        @keyframes woIn { 0% { opacity: 0; filter: blur(8px); transform: scale(.9) } 100% { opacity: 1; filter: blur(0); transform: none } }
        @keyframes feedIn { from { opacity: 0; transform: translate(-62%, 0) } to { opacity: 1; transform: translate(-50%, 0) } }
        @keyframes feedOut { to { opacity: 0; transform: translate(-40%, 0) } }
        @keyframes btnFlow { to { background-position: 200% 50% } }
        @keyframes btnBreath { 0%, 100% { box-shadow: 0 0 14px rgba(0, 191, 255, .5), 0 6px 16px rgba(0, 0, 0, .5) } 50% { box-shadow: 0 0 30px rgba(0, 255, 255, .9), 0 6px 16px rgba(0, 0, 0, .5) } }
        @keyframes flashHit { 10% { opacity: .9 } 100% { opacity: 0 } }

        /* Warn Overlay - Blue Theme */
        #warnOverlay { position: fixed; inset: 0; z-index: 999999; display: none; place-items: center; background: rgba(1, 10, 25, .88); backdrop-filter: blur(14px); pointer-events: auto !important; }
        #warnOverlay.show { display: grid; }
        .wo-card { position: relative; width: min(298px, 88vw); border-radius: 30px; padding: 1.5px; background: linear-gradient(120deg, #0050CC, #00BFFF, #00FFFF, #0080FF, #0050CC); background-size: 300% 300%; animation: woIn .45s cubic-bezier(.2, .9, .25, 1.1) both, auroraShift 6s ease-in-out infinite alternate; box-shadow: 0 0 36px rgba(0, 128, 255, .55), 0 0 90px rgba(0, 255, 255, .22), 0 30px 60px rgba(0, 0, 0, .8); }
        .wo-inner { position: relative; overflow: hidden; border-radius: 29px; padding: 10px 16px 18px; text-align: center; background: radial-gradient(120% 60% at 50% -10%, rgba(0, 191, 255, .35), transparent 60%), linear-gradient(180deg, #051020, #030a14 50%, #01050a); }
        .wo-scan { position: absolute; left: 6%; right: 6%; height: 2px; top: 0; z-index: 3; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(0, 255, 255, .95), transparent); box-shadow: 0 0 10px rgba(0, 255, 255, .8); animation: scanDown 3s linear infinite; }
        .wo-grip { width: 56px; height: 5px; margin: 0 auto 8px; border-radius: 3px; background: linear-gradient(90deg, rgba(0, 191, 255, .3), rgba(180, 240, 255, .85), rgba(0, 191, 255, .3)); }
        .wo-head { display: flex; justify-content: center; }
        .wo-head-badge { padding: 4px 12px; border-radius: 999px; font: 700 7px "Orbitron", sans-serif; letter-spacing: .32em; color: #00FFFF; border: 1px solid rgba(0, 191, 255, .3); background: rgba(3, 15, 35, .75); }
        .wo-lock { position: relative; width: 46px; height: 46px; margin: 14px auto 0; border-radius: 50%; display: grid; place-items: center; color: #00FFFF; line-height: 1; background: radial-gradient(circle at 50% 40%, rgba(5, 30, 60, .9), rgba(2, 10, 20, .96)); border: 1.5px solid #00BFFF; box-shadow: 0 0 18px rgba(0, 191, 255, .55), inset 0 0 12px rgba(0, 191, 255, .2); }
        .wo-lock::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 1.5px solid rgba(0, 255, 255, .9); animation: iconPing 1.8s ease-out infinite; }
        .wo-lock .ico { width: 22px; height: 22px; filter: drop-shadow(0 0 5px currentColor); }
        .wo-title { margin-top: 12px; font: 700 20px "Orbitron", sans-serif; letter-spacing: .3em; color: #fff; text-shadow: 0 1px 0 #0050CC, 0 2px 0 #003080, 0 3px 6px rgba(0, 0, 0, .7), 0 0 16px rgba(0, 255, 255, .75); }
        .wo-msg { display: inline-block; margin-top: 10px; padding: 5px 16px; border-radius: 999px; font: 700 9px "Orbitron", sans-serif; letter-spacing: .28em; color: #fff; background: linear-gradient(90deg, #003080, #0080FF); box-shadow: 0 0 16px rgba(0, 128, 255, .55); animation: blink 1.2s infinite alternate; }
        .wo-sub { margin-top: 10px; font: 600 7.5px "Montserrat", sans-serif; letter-spacing: .18em; color: #00BFFF; }
        .wo-actions { margin-top: 14px; }
        #warnRegBtn { position: relative; overflow: hidden; width: 100%; height: 44px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .3); cursor: pointer; color: #fff; font: 700 11px "Orbitron", sans-serif; letter-spacing: .22em; background: linear-gradient(90deg, #0050CC 0%, #0080FF 25%, #00BFFF 50%, #0080FF 75%, #0050CC 100%); background-size: 200% 100%; animation: btnFlow 3s linear infinite, btnBreath 2.2s ease-in-out infinite; text-shadow: 0 1px 2px rgba(0, 30, 80, .8); }
        #warnRegBtn .ico { width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; filter: drop-shadow(0 1px 1px rgba(0, 30, 80, .6)); }
        #warnRegBtn:active { transform: scale(.97); }

        /* Live Feed - Blue Theme */
        #activityLayer { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9000; }
        .activity-card { position: absolute; left: 50%; top: 58px; width: max-content; min-width: 218px; max-width: 268px; transform: translate(-50%, 0); padding: 6px 13px 6px 7px; display: flex; align-items: center; gap: 8px; border-radius: 999px; border: 1px solid rgba(0, 191, 255, .55); background: linear-gradient(90deg, rgba(5, 20, 45, .97), rgba(2, 8, 16, .97)); box-shadow: 0 0 22px rgba(0, 128, 255, .4), 0 12px 26px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .12); opacity: 0; animation: feedIn .4s cubic-bezier(.2, 1, .3, 1) forwards, feedOut .35s ease 3.8s forwards; font-family: "Montserrat", sans-serif; }
        .activity-icon { position: relative; width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: linear-gradient(180deg, #0080FF, #00FFFF); font: 700 14px "Orbitron", sans-serif; color: #fff; box-shadow: 0 0 0 2px rgba(180, 240, 255, .4); }
        .activity-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .activity-content { min-width: 0; flex: 1; }
        .activity-top { display: flex; align-items: center; gap: 5px; font: 700 6.5px "Orbitron", sans-serif; letter-spacing: .24em; color: #80d4ff; }
        .activity-dot { width: 5px; height: 5px; border-radius: 50%; background: #00FFFF; box-shadow: 0 0 8px #00FFFF; animation: blink .5s infinite alternate; }
        .activity-main { margin-top: 1px; font: 700 9.5px "Montserrat", sans-serif; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .activity-user-name { font-size: 11.5px; letter-spacing: .04em; }
        .activity-number { color: #00FFFF; font-family: "Orbitron", sans-serif; text-shadow: 0 0 8px rgba(0, 255, 255, .6); }
        .activity-period { font: 400 6.5px monospace; letter-spacing: .08em; color: #00BFFF; }

        /* Flash */
        #flash { position: fixed; inset: 0; z-index: 99999; pointer-events: none; opacity: 0; background: radial-gradient(circle, rgba(255, 255, 255, .85), rgba(0, 191, 255, .45) 30%, transparent 72%); }
        #flash.go { animation: flashHit .55s ease-out; }

        /* ============================================================
           ELITE VAULT UI (PREMIUM NEON BLUE GLASS PANEL)
        ============================================================ */
        .glass-panel {
            position: fixed; z-index: 10; width: 230px; max-width: 86%; height: 265px; max-height: 90vh; border-radius: 20px;
            background: linear-gradient(135deg, rgba(8, 24, 40, 0.95) 0%, rgba(3, 10, 20, 0.98) 50%, rgba(5, 15, 30, 0.95) 100%);
            backdrop-filter: blur(35px) saturate(140%); -webkit-backdrop-filter: blur(35px) saturate(140%);
            border: 1px solid rgba(0, 128, 255, 0.3); border-top: 1px solid rgba(0, 191, 255, 0.5); border-left: 1px solid rgba(0, 128, 255, 0.35);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.99), 0 0 45px rgba(0, 128, 255, 0.3), 0 0 80px rgba(0, 255, 255, 0.2), inset 0 0 25px rgba(0, 128, 255, 0.15);
            display: flex; flex-direction: column; color: white; overflow: hidden; cursor: grab; touch-action: none; will-change: transform, left, top, width, height; transform: translateZ(0); pointer-events: auto; 
        }
        .glass-panel:active { cursor: grabbing; }

        .rotating-border-container { position: absolute; inset: 0; border-radius: 20px; padding: 2px; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; z-index: 20; overflow: hidden; }
        .rotating-border-container::before, .rotating-border-container::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: conic-gradient(transparent 0deg, transparent 270deg, rgba(0, 191, 255, 0.1) 300deg, rgba(0, 128, 255, 0.6) 340deg, #00FFFF 360deg); animation: panelBorderRotate 2.5s linear infinite; }
        .rotating-border-container::after { animation-delay: -1.25s; }
        @keyframes panelBorderRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .glass-panel.minimized .rotating-border-container { display: none; }

        .glass-panel::before { content: ""; position: absolute; inset: 0; background: linear-gradient(45deg, rgba(0, 128, 255, 0.05) 25%, transparent 25%, transparent 75%, rgba(0, 128, 255, 0.05) 75%, rgba(0, 128, 255, 0.05)), linear-gradient(45deg, rgba(0, 128, 255, 0.05) 25%, transparent 25%, transparent 75%, rgba(0, 128, 255, 0.05) 75%, rgba(0, 128, 255, 0.05)); background-size: 20px 20px; background-position: 0 0, 10px 10px; z-index: 1; pointer-events: none; border-radius: 20px; }

        #moneyCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; border-radius: 20px; }

        /* MINIMIZED BLUE ORB */
        .glass-panel.minimized { width: 60px; height: 60px; border-radius: 50%; padding: 0; box-shadow: 0 0 15px rgba(0, 128, 255, 0.6); border: none; background: transparent; overflow: visible; }
        .glass-panel.minimized::before { display: none; }
        .glass-panel.minimized::after { content: ''; position: absolute; top: -6%; left: -6%; width: 112%; height: 112%; background: conic-gradient(#00FFFF 0deg, #00008B 120deg, #000 240deg, #00FFFF 360deg); animation: spinBorder 1.5s linear infinite; z-index: -1; border-radius: 50%; }
        @keyframes spinBorder { 100% { transform: rotate(360deg); } }
        
        .glass-panel.minimized .content-overlay, .glass-panel.minimized #moneyCanvas { opacity: 0; pointer-events: none; display: none !important; }
        .glass-panel.minimized .logo-circle { opacity: 1; pointer-events: auto; display: flex; background: radial-gradient(circle at 30% 30%, rgba(15, 30, 60, 0.95), rgba(3, 10, 20, 0.98)); border-radius: 50%; width: 100%; height: 100%; overflow: hidden; z-index: 2; animation: spAct 3.5s ease-in-out infinite; border: 2px solid rgba(0, 128, 255, 0.5); cursor: pointer; }
        @keyframes spAct { 0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); } 50% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); box-shadow: 0 0 25px #00FFFF; } 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); } }

        .content-overlay { position: relative; z-index: 5; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 8px 12px; pointer-events: auto; gap: 5px; width: 100%; opacity: 1; text-align: center; }

        .logo-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; display: none; align-items: center; justify-content: center; z-index: 30; pointer-events: none; }
        .mini-dot { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; background: linear-gradient(135deg, #00BFFF, #0050CC); border-radius: 50%; z-index: 10; box-shadow: 0 0 8px #00FFFF; animation: dotPulse 1s infinite alternate; }
        @keyframes dotPulse { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(1.2); opacity: 1; } }
        .logo-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; z-index: 1; }
        
        /* HUD HEADER */
        .pred-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 2px; }
        .pred-header .vault-title { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 2px; color: #ffffff; text-shadow: 0 0 5px #00BFFF, 0 0 10px #00FFFF; text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: clip; }
        .pred-header .badge-tier { background: rgba(0, 128, 255, 0.2); color: #00FFFF; padding: 2px 8px; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 7.5px; border: 1px solid rgba(0, 191, 255, 0.5); letter-spacing: 1px; box-shadow: 0 0 15px rgba(0, 128, 255, 0.25); text-align: center; text-shadow: 0 0 5px currentColor; white-space: nowrap; }
        .header-laser { width: 100%; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(0,191,255,0.9) 50%, transparent 100%); margin: 2px 0; opacity: 0.8; box-shadow: 0 0 10px rgba(0,255,255,0.3); }

        .pred-status-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 3px 8px; background: rgba(5, 15, 30, 0.6); border-radius: 8px; border: 1px solid rgba(0, 128, 255, 0.2); box-shadow: inset 0 2px 5px rgba(0,0,0,0.7), 0 0 15px rgba(0,128,255,0.1); transition: all 0.3s ease; }
        .state-text-group { display: flex; flex-direction: column; gap: 1px; flex: 1; text-align: left; align-items: flex-start; justify-content: center; }
        .pred-status-row .state-label { font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 800; color: #fff; letter-spacing: 1px; text-shadow: 0 0 5px currentColor; text-align: left; }
        .pred-status-row .state-period { font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 900; color: #fff; letter-spacing: 2px; text-shadow: 0 0 5px rgba(255,255,255,0.8); text-align: left; }
        .ping-group { display: flex; align-items: center; gap: 6px; }
        .ping-text { font-family: 'Orbitron', monospace; font-size: 8px; font-weight: 800; color: #00BFFF; text-shadow: 0 0 5px currentColor; letter-spacing: 1px; }
        .pred-status-row .state-dot { width: 6px; height: 6px; border-radius: 50%; background: #00FFFF; box-shadow: 0 0 10px #00FFFF, 0 0 20px #0080FF; animation: pulse-dot 1.5s infinite; }
        @keyframes pulse-dot { 0% { opacity: 0.5; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.5; transform: scale(0.8); } }

        /* MAIN HUD TARGET BOX */
        .pred-number-box { 
            position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            flex-grow: 1; min-height: 100px; background: radial-gradient(circle at center, rgba(0, 128, 255, 0.15) 0%, rgba(3, 10, 20, 0.9) 100%); 
            border-radius: 12px; border: 1px solid rgba(0, 128, 255, 0.2); box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.95), 0 5px 20px rgba(0,0,0,0.7); 
            overflow: hidden; text-align: center; 
        }

        /* QUANTUM REACTOR CORE BACKGROUND */
        .quantum-hud-bg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; height: 140px; pointer-events: none; z-index: 1;
            display: flex; align-items: center; justify-content: center;
        }
        .quantum-hud-bg svg { width: 100%; height: 100%; }
        .hud-spin-slow { animation: hud-spin 10s linear infinite; transform-origin: center; }
        .hud-spin-fast-rev { animation: hud-spin-rev 4s linear infinite; transform-origin: center; }
        .hud-spin-med { animation: hud-spin 6s linear infinite; transform-origin: center; }
        .hud-pulse { animation: hud-pulse-glow 1.5s infinite alternate; transform-origin: center; }
        @keyframes hud-spin { 100% { transform: rotate(360deg); } }
        @keyframes hud-spin-rev { 100% { transform: rotate(-360deg); } }
        @keyframes hud-pulse-glow { 0% { transform: scale(0.9); opacity: 0.4; } 100% { transform: scale(1.1); opacity: 1; } }

        .hud-radar-sweep {
            position: absolute; width: 120px; height: 120px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 60%, rgba(0, 255, 255, 0.4) 100%);
            animation: hud-spin 2.5s linear infinite; mix-blend-mode: screen;
        }
        .hud-ripple {
            position: absolute; width: 35px; height: 35px; border-radius: 50%;
            border: 2px solid #00FFFF; opacity: 0;
            animation: ripple-expand 2.5s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        }
        .hud-ripple.delay { animation-delay: 1.25s; border-color: #00BFFF; }
        @keyframes ripple-expand { 0% { transform: scale(1); opacity: 0.8; border-width: 3px; } 100% { transform: scale(3.5); opacity: 0; border-width: 0; } }

        /* DECRYPTION OVERLAY (HACK DROP EFFECT) */
        .decrypt-overlay { 
            position: absolute; inset: 0; z-index: 10; display: none; 
            background: rgba(3, 10, 20, 0.95); backdrop-filter: blur(10px); 
        }
        .pred-number-box.is-scanning .decrypt-overlay { display: block; }
        .pred-number-box.is-scanning .quantum-hud-bg { opacity: 0.3; }
        
        .bg-data-stream {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 255, 0.08) 3px, transparent 4px);
            opacity: 0.8; animation: scroll-stream-down 0.5s linear infinite;
        }
        @keyframes scroll-stream-down { 0% { background-position: 0 0; } 100% { background-position: 0 10px; } }

        /* MATRIX DROP EFFECT (BLUE) */
        .matrix-rain { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
        .drop-line {
            position: absolute; top: -60px; width: 2.5px; height: 50px;
            background: linear-gradient(to bottom, transparent, #00FFFF 80%, #ffffff 100%);
            box-shadow: 0 0 10px #00FFFF; border-radius: 2px; animation: hack-drop linear infinite;
        }
        .drop-line.light { background: linear-gradient(to bottom, transparent, #00BFFF 80%, #ffffff 100%); box-shadow: 0 0 10px #00BFFF; }
        @keyframes hack-drop { 0% { transform: translateY(-20px); opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(160px); opacity: 0; } }

        /* EQUALIZERS */
        .cyber-eq { position: absolute; top: 15px; bottom: 15px; width: 6px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; opacity: 0.8; pointer-events: none; }
        .cyber-eq.left { left: 6px; } .cyber-eq.right { right: 6px; }
        .eq-bar { width: 100%; background: #00FFFF; border-radius: 2px; box-shadow: 0 0 8px #00FFFF; }
        .eq-1 { height: 10%; animation: eq-bounce 0.2s infinite alternate; } .eq-2 { height: 20%; animation: eq-bounce 0.15s infinite alternate-reverse; } .eq-3 { height: 15%; animation: eq-bounce 0.25s infinite alternate; } .eq-4 { height: 25%; animation: eq-bounce 0.18s infinite alternate-reverse; } .eq-5 { height: 12%; animation: eq-bounce 0.22s infinite alternate; }
        .cyber-eq.right .eq-bar { background: #00BFFF; box-shadow: 0 0 8px #00BFFF; }
        @keyframes eq-bounce { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1.8); } }

        /* SCANNING RING */
        .decrypt-ring {
            position: absolute; top: 50%; left: 50%; margin-top: -30px; margin-left: -30px; width: 60px; height: 60px; border-radius: 50%;
            border: 3px solid transparent; border-top-color: #00FFFF; border-bottom-color: #0080FF;
            animation: cyber-spin 0.4s linear infinite; filter: drop-shadow(0 0 10px #00FFFF); z-index: 5;
        }
        .decrypt-ring::after {
            content: ''; position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px; 
            border-radius: 50%; border: 2px dashed #00008B; animation: cyber-spin-rev 0.6s linear infinite;
        }
        @keyframes cyber-spin { 100% { transform: rotate(360deg); } } @keyframes cyber-spin-rev { 100% { transform: rotate(-360deg); } }
        
        /* SHUFFLING BALL */
        .shuffling-ball-wrap {
            position: absolute; top: 50%; left: 50%; margin-top: -20px; margin-left: -20px;
            z-index: 15; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; background: #000;
            box-shadow: 0 0 25px 8px rgba(0, 255, 255, 0.7), inset 0 0 15px rgba(0, 128, 255, 0.9); border: 2px solid #00FFFF;
        }
        .shuffling-ball-wrap img { width: 100%; height: 100%; object-fit: cover; filter: brightness(1.2); }

        .decrypt-text {
            position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
            font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 900;
            color: #00FFFF; letter-spacing: 3px; text-shadow: 0 0 10px #00FFFF; animation: pulse-rapid 0.15s infinite alternate;
        }
        @keyframes pulse-rapid { 0% { opacity: 0.3; } 100% { opacity: 1; } }

        /* CENTER CONTENTS & RESULT */
        .center-content-wrapper { position: relative; z-index: 15; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 4px; transition: opacity 0.3s; text-align: center; }

        .box-state-text { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; margin-bottom: 2px; z-index: 15; transition: all 0.3s ease; }
        .box-main-text { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900; color: #ffffff; letter-spacing: 1px; text-shadow: 0 0 5px #ffffff, 0 0 10px rgba(0,255,255,0.5); text-align: center; }

var shuffleInterval = null;
function incrementPeriodDigits(value){
  var digits = String(value || '').replace(/[^0-9]/g, ''); if(!digits) return '';
  var chars = digits.split(''), carry = 1;
  for(var i=chars.length-1; i>=0 && carry; i--){
    var d = Number(chars[i]) + carry;
    if(d >= 10){ chars[i] = '0'; carry = 1; } else { chars[i] = String(d); carry = 0; }
  }
  if(carry) chars.unshift('1'); return chars.join('');
}

async function fetchHistory(){
  try {

    if(response.ok) {

        var list = json.data?.list || json.data || json.list;

  } catch(error){}
}

async function runScan(){
  if(_lastRouteKind !== "wingo"){ navigate(WINGO_URL); return; }
  if(scanning) return;
  scanning = true;
  currentState = "scan";
  updateUI();

  // Start Shuffle Animation
  const shuffleImg = document.getElementById('shufflingBallImg');
  shuffleInterval = setInterval(() => { shuffleImg.src = numImgLinks[Math.floor(Math.random() * 10)]; }, 40);

  // Fetch History & Wait
  await fetchHistory();

}

  var row = historyData[0] || { issue: String(Date.now()).slice(-8), number: 5 };
  var currentDigits = String(row.issue).replace(/[^0-9]/g, '');

const innerCanvas = document.getElementById('moneyCanvas'), innerCtx = innerCanvas.getContext('2d', { alpha: true });

function resizeInnerCanvas() { innerCanvas.width = panel.offsetWidth; innerCanvas.height = panel.offsetHeight; }

class TechFragment {
    constructor(w) { this.x = Math.random() * w; this.y = -20; this.vy = Math.random() * 1.5 + 0.5; this.rot = Math.random() * Math.PI * 2; this.vRot = (Math.random() - 0.5) * 0.05; this.scale = Math.random() * 0.6 + 0.4; this.type = Math.random() < 0.4 ? 'hex' : (Math.random() < 0.7 ? 'cube' : 'bin'); this.opacity = 0.9; this.fadeSpeed = 0.005 + Math.random() * 0.005; }
    update(h) { this.y += this.vy; this.rot += this.vRot; this.opacity -= this.fadeSpeed; return this.y > h || this.opacity <= 0; }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot); ctx.globalAlpha = Math.max(0, this.opacity); ctx.shadowBlur = 10;
        if (this.type === 'hex') { ctx.shadowColor = '#00FFFF'; ctx.strokeStyle = 'rgba(0, 255, 255, 0.9)'; ctx.lineWidth = 1.5; ctx.beginPath(); for (let i = 0; i < 6; i++) { let angle = i * Math.PI / 3; let px = Math.cos(angle) * 8 * this.scale; let py = Math.sin(angle) * 8 * this.scale; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } ctx.closePath(); ctx.stroke(); } 
        else if (this.type === 'cube') { ctx.shadowColor = '#0080FF'; ctx.strokeStyle = 'rgba(0, 128, 255, 0.8)'; ctx.lineWidth = 1.5; ctx.strokeRect(-5 * this.scale, -5 * this.scale, 10 * this.scale, 10 * this.scale); ctx.fillStyle = 'rgba(0,255,255,0.3)'; ctx.fillRect(-5 * this.scale, -5 * this.scale, 10 * this.scale, 10 * this.scale); } 
        else if (this.type === 'bin') { ctx.shadowColor = '#00FFFF'; ctx.fillStyle = '#00FFFF'; ctx.font = (10 * this.scale) + 'px "Orbitron"'; ctx.fillText(Math.random() > 0.5 ? '1' : '0', -4, 4); }
        ctx.restore();
    }
}
function animateInner() {
    if (isOpen) {
        innerCtx.clearRect(0, 0, innerCanvas.width, innerCanvas.height);
        if (Math.random() < 0.15) innerItems.push(new TechFragment(innerCanvas.width));
        innerItems = innerItems.filter(item => !item.update(innerCanvas.height));
        innerItems.forEach(item => item.draw(innerCtx));
    }
    requestAnimationFrame(animateInner);
}
requestAnimationFrame(animateInner);
